<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700"
     preserveAspectRatio="xMidYMid meet" role="img"
     aria-label="Diagram: two dashed paths meet at a dot, separate again, and end a short way later. From the meeting point a single solid line continues to the edge of the frame, labelled the record.">
  <!-- Fig. 8 in the site-wide append-only numbering. File named fig-5 because it is
       the fifth of the six figures in _reference/FIGURE-SYSTEM.md section 2. Geometry,
       labels, caption and aria-label are that file's, character for character.
       Solid first, then dashed, then dots, then labels. -->

  <!-- The record. The only solid element: it outlasts every dashed path on the plate. -->
  <line class="fig-solid" pathLength="1" vector-effect="non-scaling-stroke"
        x1="600" y1="350" x2="1600" y2="350"/>

  <!-- The two parties arriving, both cropped by the left frame edge. -->
  <path class="fig-dash" vector-effect="non-scaling-stroke"
        d="M 0 160 C 260 200, 460 280, 600 350"/>
  <path class="fig-dash" vector-effect="non-scaling-stroke"
        d="M 0 560 C 260 520, 460 440, 600 350"/>

  <!-- The two parties leaving. They end plainly. No terminal mark. -->
  <path class="fig-dash" vector-effect="non-scaling-stroke"
        d="M 600 350 C 760 300, 880 250, 960 210"/>
  <path class="fig-dash" vector-effect="non-scaling-stroke"
        d="M 600 350 C 760 400, 880 450, 960 490"/>

  <!-- The introduction. The one node where the four paths and the record share a point. -->
  <circle class="fig-dot" cx="600" cy="350" r="6"/>

  <text class="fig-label" x="600" y="295" text-anchor="middle">The introduction</text>
  <text class="fig-label" x="1000" y="180" text-anchor="start">The parties</text>
  <text class="fig-label" x="1560" y="320" text-anchor="end">The record</text>
</svg>
