<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700"
     preserveAspectRatio="xMidYMid meet" role="img"
     aria-label="Diagram: a dashed path passes through a narrow gate between two vertical lines, with a dot at the point where the questions are asked. Past the gate the path either continues as a solid line off the edge of the frame, labelled introduced, or ends a short way in, labelled not taken forward.">
  <!-- The gate. Two vertical segments, the aperture between them at y 300 to 420. -->
  <line class="fig-solid" pathLength="1" vector-effect="non-scaling-stroke" x1="820" y1="80" x2="820" y2="300"/>
  <line class="fig-solid" pathLength="1" vector-effect="non-scaling-stroke" x1="820" y1="420" x2="820" y2="640"/>
  <!-- Continuing branch. Solid because the meeting happened. Cropped by the right frame edge. -->
  <path class="fig-solid" pathLength="1" vector-effect="non-scaling-stroke" d="M 828 360 C 1050 350, 1300 330, 1600 320"/>
  <!-- Entering path. Dashed: a proposal. Cropped by the left frame edge. -->
  <path class="fig-dash" vector-effect="non-scaling-stroke" d="M 0 380 C 300 380, 560 368, 812 360"/>
  <!-- Ending branch. Ends plainly. No terminal mark: a decision not to introduce, not a defect found. -->
  <path class="fig-dash" vector-effect="non-scaling-stroke" d="M 828 368 C 950 400, 1030 450, 1080 500"/>
  <!-- The asking happens here. -->
  <circle class="fig-dot" cx="820" cy="360" r="6"/>
  <text class="fig-label" text-anchor="start" x="860" y="120">The questions are asked here</text>
  <text class="fig-label" text-anchor="start" x="1330" y="280">Introduced</text>
  <text class="fig-label" text-anchor="start" x="960" y="560">Not taken forward</text>
</svg>
